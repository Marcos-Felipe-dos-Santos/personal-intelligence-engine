name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: python -m pytest -q

      - name: Compile
        run: python -m compileall personal_intelligence_engine

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Smoke installed wheel outside checkout
        run: python -c "import pathlib, subprocess, sys; subprocess.run([sys.executable, 'tests/smoke_installed_wheel.py', str(next(pathlib.Path('dist').glob('*.whl')))], check=True)"
